services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ideal10spring-backend:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/ideal10spring
      DB_USERNAME: ideal10spring
      DB_PASSWORD: ideal10spring
      DB_DRIVER: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-replace_with_base64_encoded_32_byte_secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ideal10spring-frontend:local
    depends_on:
      - backend
    ports:
      - "5173:80"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ideal10spring
      POSTGRES_USER: ideal10spring
      POSTGRES_PASSWORD: ideal10spring
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideal10spring -d ideal10spring"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
